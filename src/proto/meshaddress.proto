syntax = "proto3";
package espmeshmesh;


enum ProtocolType {
  SRC_NONE       = 0x00;
  SRC_BROADCAST  = 0x01;
  SRC_UNICAST    = 0x02;
  SRC_PREROUTED  = 0x03;
  SRC_MULTIPATH  = 0x04;
  SRC_POLITEBRD  = 0x05;
  SRC_BROADCAST2 = 0x06;
  SRC_CONNPATH   = 0x07;
  SRC_STARPATH   = 0x08;
  SRC_FILTER     = 0xfe;
  SRC_SERIAL     = 0xff;
}

message MeshAddress {
  uint32 address = 1;
  uint32 port = 2;
  repeated uint32 repeaters = 3;
  ProtocolType protocol = 4;
}